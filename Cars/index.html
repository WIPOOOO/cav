<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- ✏️ CHANGE: title per category -->
  <title>Cars — Caversen Print</title>
  
  <link rel="icon" type="image/png" href="../favicon.png?v=2">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Cairo:wght@600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root { 
  --bg-dark: #000000;
  --glass: rgba(255, 255, 255, 0.04); 
  --glass-hover: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.1); 
  --text: #f0ece4; 
  --muted: #888; 
  --red: #b31f24;
  --line: rgba(240, 236, 228, 0.14);
}

    html { scrollbar-gutter: stable; }

    body { 
  background-color: var(--bg-dark); 
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--text); 
  font-family: 'Montserrat', sans-serif; 
  line-height: 1.6;
  overflow-x: hidden; 
  scroll-behavior: smooth;
}

    header { 
  position: fixed; top: 0; left: 0; width: 100%;
  background-color: rgba(0, 0, 0, 0.75);
  background-image: radial-gradient(var(--line) 1px, transparent 1px);
  background-size: 22px 22px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 16px 40px; 
  display: grid; grid-template-columns: 1fr 1fr 1fr; 
  align-items: center; z-index: 1000;
}

    .header-left { display: flex; width: 100%; }
    .header-left { justify-content: flex-start; }
    .header-socials { justify-content: flex-end; gap: 20px; }

    .back-arrow { 
      text-decoration: none; color: var(--text); font-size: 20px; 
      display: flex; align-items: center; justify-content: center;
      padding: 20px; margin-left: -20px; transition: 0.2s;
    }
    .back-arrow:hover { transform: translateX(-4px); opacity: 0.6; }

    .logo { display: flex; justify-content: center; text-decoration: none; width: 100%; }
    .logo img { height: 70px; width: auto; display: block; margin: 0 auto; }

    .header-socials { display: flex; gap: 22px; justify-content: flex-end; }
.header-socials a {
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: color 0.2s ease;
  text-decoration: none;
}
.header-socials a:hover { color: var(--red); }
.header-socials svg { width: 19px; height: 19px; fill: currentColor; }

    main { padding: 160px 40px 60px; max-width: 1400px; margin: 0 auto; }
    
    .page-title { 
      font-size: 13px; font-weight: 300; letter-spacing: 6px; 
      text-transform: uppercase; margin-bottom: 50px; 
      color: var(--muted); text-align: center;
    }

    .gallery { 
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; 
      animation: fadeIn 0.6s ease-out; 
    }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── LOADING SPINNER ── */
    .gallery-loading {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 20px;
      gap: 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .gallery-loading p {
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted);
    }

    .gallery-item { 
      position: relative;
      background: var(--glass); border: 1px solid var(--border); 
      border-radius: 12px; overflow: hidden; cursor: zoom-in;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ── QUICK DOWNLOAD BADGE (mobile only, top-left of each thumbnail) ── */
    .quick-download {
      position: absolute; top: 10px; left: 10px; z-index: 5;
      display: none; align-items: center; gap: 6px;
      padding: 6px 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      cursor: pointer;
    }
    .quick-download i { font-size: 11px; color: #ffffff; }
    .quick-download .qd-text { display: flex; flex-direction: column; line-height: 1.15; }
    .quick-download .qd-ar { font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 13px; color: #fff; direction: rtl; }

    @media (max-width: 900px) {
      .quick-download { display: flex; }
    }
    .gallery-item:hover { border-color: rgba(255, 255, 255, 0.25); transform: translateY(-6px); background: var(--glass-hover); }
    .gallery-item img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; transition: 0.5s ease; }
    .gallery-item:hover img { transform: scale(1.03); }

    /* ── PAGINATION ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 60px;
      flex-wrap: wrap;
    }
    .page-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: rgba(255,255,255,0.3); color: var(--text); background: var(--glass-hover); }
    .page-btn.active { background: white; border-color: white; color: black; font-weight: 600; }
    .page-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .page-btn.arrow { font-size: 14px; }

    .lightbox {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.96); backdrop-filter: blur(10px);
      display: none; justify-content: center; align-items: center;
      flex-direction: column; gap: 18px;
      z-index: 2000; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img { max-width: 90%; max-height: 85%; border-radius: 4px; }
    .close-lightbox { position: absolute; top: 30px; right: 40px; color: white; font-size: 35px; cursor: pointer; }

    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      color: #ffffff; font-size: 18px; cursor: pointer;
      width: 45px; height: 45px;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a0a;
      border: 2px solid #ffffff;
      border-radius: 50%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 2001;
    }
    .lightbox-arrow:hover { background: #000000; box-shadow: 0 6px 20px rgba(255,255,255,0.1); }
    .lightbox-arrow.prev { left: 25px; }
    .lightbox-arrow.next { right: 25px; }
    @media (max-width: 600px) {
      .lightbox-arrow { width: 38px; height: 38px; font-size: 15px; }
      .lightbox-arrow.prev { left: 10px; }
      .lightbox-arrow.next { right: 10px; }
    }

    /* ── LIGHTBOX CONTENT + DOWNLOAD BUTTON ── */
    .lightbox-content {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      max-width: 90%; max-height: 90%;
    }
    .lightbox-content img { max-width: 100%; max-height: 75vh; border-radius: 4px; display: block; }

    .download-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 14px 28px;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      color: var(--text);
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .download-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-3px);
    }
    .download-btn i { font-size: 18px; color: var(--red); }
    .dl-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.3; }
    .dl-en { font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
    .dl-ar { font-family: 'Cairo', sans-serif; font-weight: 600; font-size: 12px; color: var(--muted); direction: rtl; }
    .download-btn:hover .dl-ar { color: var(--red); }

    @media (max-width: 600px) {
      .download-btn { padding: 12px 22px; }
      .lightbox-content img { max-height: 65vh; }
    }

    #backToTop {
      position: fixed; bottom: 30px; right: 30px; width: 45px; height: 45px;
      background: #0a0a0a; border: 2px solid #ffffff;
      color: #ffffff; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; cursor: pointer;
      opacity: 0; visibility: hidden; transition: all 0.3s ease; 
      z-index: 1500; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #backToTop.show { opacity: 1; visibility: visible; }
    #backToTop:hover { transform: translateY(-5px); background: #000000; box-shadow: 0 6px 20px rgba(255,255,255,0.1); }

    .contact-section { text-align: center; padding: 100px 20px; margin-top: 20px; }
    .contact-title { 
      font-size: 16px; font-weight: 500; color: var(--text); 
      margin-bottom: 40px; letter-spacing: 2px; text-transform: uppercase;
    }
    .contact-button-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .contact-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 100%; max-width: 320px; padding: 16px 30px;
      background: rgba(255, 255, 255, 0.05); border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: 50px; color: var(--text); text-decoration: none;
      font-size: 14px; font-weight: 500; letter-spacing: 1px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .contact-btn i { font-size: 20px; }
    .contact-btn:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.4); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3); }
    .contact-btn.whatsapp:hover i { color: #25D366; }
    .contact-btn.instagram:hover i { color: #E1306C; }
    
    footer { padding: 40px 20px; text-align: center; font-size: 9px; color: var(--muted); letter-spacing: 3px; border-top: 1px solid var(--border); }

    @media (max-width: 900px) { 
  .gallery { grid-template-columns: repeat(2, 1fr); } 
  header { padding: 10px 20px; } 
  .logo img { height: 56px; } 
  main { padding-top: 130px; } 
}
    /* 2 columns on small mobile, never 1 */
    @media (max-width: 500px) { .gallery { grid-template-columns: 1fr; } }
    @media (min-width: 768px) { .contact-button-container { flex-direction: row; justify-content: center; } }
  </style>
</head>

<script>
  // ✏️ CHANGE: images per page if you want (20 is good)
  const IMAGES_PER_PAGE = 20;

  const gallery = document.getElementById('gallery');
  const pagination = document.getElementById('pagination');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const backToTop = document.getElementById('backToTop');

  let allImages = [];   // filled automatically by discovery
  let currentPage = 1;
  let totalPages = 1;

  // ── STEP 1: discover images — fast HEAD checks, shows page 1 early, keeps scanning silently ──
function discoverImages() {
  const BATCH_SIZE = 15;
  const MAX_CONSECUTIVE_MISSES = 25;
  const HARD_LIMIT = 300;
  let nextToCheck = 1;
  let consecutiveMisses = 0;
  let keepGoing = true;
  let firstPageShown = false;

  function checkOne(num) {
    const fileName = `${num}.webp`;
    return fetch(fileName, { method: 'HEAD' })
      .then(res => ({ num, fileName, exists: res.ok }))
      .catch(() => ({ num, fileName, exists: false }));
  }

  function showFirstPageIfReady() {
    if (!firstPageShown && allImages.length >= IMAGES_PER_PAGE) {
      firstPageShown = true;
      totalPages = Math.max(1, Math.ceil(allImages.length / IMAGES_PER_PAGE));
      renderGalleryOnly(1); // page 1 is ready — show it now, rest keeps scanning behind the scenes
    }
  }

  function runBatch() {
    if (!keepGoing || nextToCheck > HARD_LIMIT) { finish(); return; }
    const batchNums = [];
    for (let i = 0; i < BATCH_SIZE; i++) batchNums.push(nextToCheck + i);
    nextToCheck += BATCH_SIZE;

    Promise.all(batchNums.map(checkOne)).then(results => {
      results.sort((a, b) => a.num - b.num);
      for (const r of results) {
        if (r.exists) {
          allImages.push(r.fileName);
          consecutiveMisses = 0;
        } else {
          consecutiveMisses++;
          if (consecutiveMisses >= MAX_CONSECUTIVE_MISSES) { keepGoing = false; break; }
        }
      }
      showFirstPageIfReady();
      if (keepGoing) runBatch(); else finish();
    });
  }

  function finish() {
    allImages.sort((a, b) => parseInt(a) - parseInt(b));
    totalPages = Math.max(1, Math.ceil(allImages.length / IMAGES_PER_PAGE));
    if (!firstPageShown) {
      renderGalleryOnly(1); // total images < one full page — show whatever was found
    } else {
      renderPagination(); // just quietly refresh the page-number buttons, don't disturb the user
    }
  }

  runBatch();
}

  // ── STEP 2: render one page of images ──
  function renderGalleryOnly(page) {
    currentPage = page;
    gallery.innerHTML = '';

    const start = (page - 1) * IMAGES_PER_PAGE;
    const end = Math.min(start + IMAGES_PER_PAGE, allImages.length);
    const pageImages = allImages.slice(start, end);

    pageImages.forEach((fileName, idx) => {
      const item = document.createElement('div');
      item.className = 'gallery-item';
      const imgIndex = start + idx;
      item.innerHTML = `
        <div class="quick-download" onclick="event.stopPropagation(); downloadImage(${imgIndex})">
          <i class="fa-solid fa-download"></i>
          <span class="qd-text">
            <span class="qd-ar">تحميل الصورة</span>
          </span>
        </div>
        <img src="${fileName}" alt="Print ${imgIndex + 1}" loading="lazy">
      `;
      item.onclick = () => openLightbox(imgIndex);
      gallery.appendChild(item);
    });

    renderPagination();
  }

  function renderPage(page) {
    renderGalleryOnly(page);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── STEP 3: render pagination buttons ──
  function renderPagination() {
    pagination.innerHTML = '';
    if (totalPages <= 1) return; // hide if only 1 page

    const prev = document.createElement('button');
    prev.className = 'page-btn arrow';
    prev.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
    prev.disabled = currentPage === 1;
    prev.onclick = () => renderPage(currentPage - 1);
    pagination.appendChild(prev);

    getPageRange(currentPage, totalPages).forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (p === currentPage ? ' active' : '');
      btn.textContent = p;
      btn.onclick = () => renderPage(p);
      pagination.appendChild(btn);
    });

    const next = document.createElement('button');
    next.className = 'page-btn arrow';
    next.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
    next.disabled = currentPage === totalPages;
    next.onclick = () => renderPage(currentPage + 1);
    pagination.appendChild(next);
  }

  function getPageRange(current, total) {
    if (total <= 5) return Array.from({length: total}, (_, i) => i + 1);
    if (current <= 3) return [1, 2, 3, 4, 5];
    if (current >= total - 2) return [total-4, total-3, total-2, total-1, total];
    return [current-2, current-1, current, current+1, current+2];
  }

  // ── LIGHTBOX ──
  let lightboxIndex = 0; // current index into allImages

  function openLightbox(index) {
    lightboxIndex = index;
    lightboxImg.src = allImages[lightboxIndex];
    lightbox.classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox() { lightbox.classList.remove('active'); document.body.style.overflow = 'auto'; }

  function nextImage() {
    lightboxIndex = (lightboxIndex + 1) % allImages.length;
    lightboxImg.src = allImages[lightboxIndex];
    syncPageToLightbox();
  }
  function prevImage() {
    lightboxIndex = (lightboxIndex - 1 + allImages.length) % allImages.length;
    lightboxImg.src = allImages[lightboxIndex];
    syncPageToLightbox();
  }

  // If browsing crosses into a different page, switch the gallery page underneath silently
  function syncPageToLightbox() {
    const targetPage = Math.floor(lightboxIndex / IMAGES_PER_PAGE) + 1;
    if (targetPage !== currentPage) {
      currentPage = targetPage;
      renderGalleryOnly(targetPage);
    }
  }

  // ── DOWNLOAD (converts webp → jpg in-browser via canvas) ──
  // Filename like: Caversen-Jul03-47-812.jpg
  // (month-day, second, millisecond) so two downloads in the same second never overwrite each other
  function downloadImage(index) {
    const idx = (typeof index === 'number') ? index : lightboxIndex;
    const src = allImages[idx];

    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const now = new Date();
    const stamp = `${months[now.getMonth()]}${String(now.getDate()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}-${String(now.getMilliseconds()).padStart(3,'0')}`;
    const filename = `Caversen-${stamp}.jpg`;

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      // JPG has no transparency channel — fill white behind the image first
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) { window.open(src, '_blank'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }, 'image/jpeg', 0.92);
    };
    img.onerror = () => window.open(src, '_blank'); // fallback if conversion fails
    img.src = src;
  }

  // Keyboard arrows
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'ArrowRight') nextImage();
    if (e.key === 'ArrowLeft') prevImage();
    if (e.key === 'Escape') closeLightbox();
  });

  // Swipe support (touch devices)
  let touchStartX = 0;
  let touchEndX = 0;
  const SWIPE_THRESHOLD = 50; // min px distance to count as a swipe

  lightbox.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  lightbox.addEventListener('touchend', (e) => {
    touchEndX = e.changedTouches[0].screenX;
    const diff = touchEndX - touchStartX;
    if (Math.abs(diff) > SWIPE_THRESHOLD) {
      if (diff < 0) nextImage(); // swiped left → next
      else prevImage();          // swiped right → prev
    }
  }, { passive: true });

  // ── BACK TO TOP ──
  window.onscroll = () => backToTop.classList.toggle('show', window.scrollY > 400);
  function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

  // ── START ──
  discoverImages();
</script>
</body>
</html>
